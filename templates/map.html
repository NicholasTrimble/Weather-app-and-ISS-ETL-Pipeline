{% extends "base.html" %}

{% block content %}
<style>
    #map { height: calc(100vh - 140px); width: 100%; }
    .popup-button {
        margin-top: 6px;
        padding: 6px 10px;
        font-size: 0.9rem;
        cursor: pointer;
        background-color: #2563eb;
        color: white;
        border-radius: 4px;
        border: none;
    }
    .popup-button:hover {
        background-color: #1d4ed8;
    }
</style>

<div id="map"></div>

<script>
    // Define world bounds to prevent endless horizontal scrolling
    const worldBounds = L.latLngBounds(
        L.latLng(-85, -180),
        L.latLng(85, 180)
    );

    // Initialize Map
    const map = L.map('map', {
        minZoom: 2,
        maxBounds: worldBounds,
        maxBoundsViscosity: 1.0
    }).setView([39.8283, -98.5795], 4);

    // Base Street Map Layer
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 19,
        noWrap: true,
        bounds: worldBounds
    }).addTo(map);

    // --- ANIMATED RADAR OVERLAY (FIXED FOR ZOOM) ---
    let radarLayers = [];
    let currentFrameIndex = 0;

    fetch("https://api.rainviewer.com/public/weather-maps.json")
        .then(response => response.json())
        .then(data => {
            const host = data.host;
            const frames = data.radar.past.slice(-5); // Take last 5 radar snapshots

            frames.forEach(frame => {
                const layer = L.tileLayer(`${host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                    attribution: '&copy; RainViewer',
                    opacity: 0,
                    noWrap: true,
                    bounds: worldBounds,
                    maxNativeZoom: 7, // CRITICAL FIX: Upscales tiles when zoomed in past level 7
                    maxZoom: 19
                });
                layer.addTo(map);
                radarLayers.push(layer);
            });

            if (radarLayers.length > 0) {
                radarLayers[0].setOpacity(0.55);
                
                setInterval(() => {
                    radarLayers[currentFrameIndex].setOpacity(0);
                    currentFrameIndex = (currentFrameIndex + 1) % radarLayers.length;
                    radarLayers[currentFrameIndex].setOpacity(0.55);
                }, 750);
            }
        })
        .catch(err => console.log("Radar fetch error:", err));

    // --- ISS MARKER LOGIC (FIXED BLINKING/JUMPING ISSUE) ---
    let issMarker = null;

    const issIcon = L.icon({
        iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/d/d0/International_Space_Station.svg',
        iconSize: [50, 32],
        iconAnchor: [25, 16]
    });

    function updateISSPosition() {
        fetch("/iss_position")
            .then(response => response.json())
            .then(data => {
                // Ensure we have valid numeric coordinates before moving/creating marker
                if (data.latitude !== undefined && data.longitude !== undefined) {
                    const newLatLng = [data.latitude, data.longitude];
                    
                    if (!issMarker) {
                        // Create marker only on first successful fetch
                        issMarker = L.marker(newLatLng, { icon: issIcon }).addTo(map);
                    } else {
                        // Smoothly update existing marker location
                        issMarker.setLatLng(newLatLng);
                    }
                }
            })
            .catch(err => console.log("ISS fetch error:", err));
    }

    // Fetch immediately and update every 5 seconds
    updateISSPosition();
    setInterval(updateISSPosition, 5000);

    // Weather on click logic
    map.on('click', function(e) {
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;

        fetch(`/weather_info?lat=${lat}&lon=${lon}`)
            .then(resp => resp.json())
            .then(data => {
                const tempC = data.temperature_celsius ?? "N/A";
                const tempF = data.temperature_fahrenheit ?? "N/A";
                const cloud = data.cloud_percent ?? "N/A";
                const visibility = data.visibility ?? "N/A";
                const safeLat = lat.toFixed(5).replace('.', '_').replace('-', 'm');
                const safeLon = lon.toFixed(5).replace('.', '_').replace('-', 'm');
                const btnId = `show-sky-btn-${safeLat}-${safeLon}`;

                const popupContent = `
                    <div>
                        <b>Location:</b> ${lat.toFixed(4)}, ${lon.toFixed(4)}<br>
                        <b>Temperature:</b> ${tempC}°C / ${tempF}°F<br>
                        <b>Cloud Coverage:</b> ${cloud}%<br>
                        <b>Visibility:</b> ${visibility}<br>
                        <button id="${btnId}" class="popup-button">Show Night Sky</button>
                    </div>
                `;

                L.popup().setLatLng([lat, lon]).setContent(popupContent).openOn(map);

                setTimeout(() => {
                    const btn = document.getElementById(btnId);
                    if (!btn) return;
                    btn.addEventListener("click", async () => {
                        const originalText = btn.textContent;
                        btn.disabled = true;
                        btn.textContent = "Loading…";
                        try {
                            const r = await fetch(`/star_chart?lat=${lat}&lon=${lon}`);
                            const j = await r.json();
                            if (j.error) alert("Error: " + j.error);
                            else if (j.imageUrl) window.open(j.imageUrl, "_blank");
                        } catch (err) { alert("Failed to fetch star chart."); }
                        finally { btn.disabled = false; btn.textContent = originalText; }
                    });
                }, 10);
            });
    });
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<style>
    #map { height: calc(100vh - 140px); width: 100%; }
    
    /* Sleek Pulsing Glow Effect Around ISS Icon */
    .iss-marker-container {
        position: relative;
    }
    .iss-pulsing-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 48px;
        height: 48px;
        margin-top: -24px;
        margin-left: -24px;
        border-radius: 50%;
        background: rgba(2, 132, 199, 0.35);
        box-shadow: 0 0 12px rgba(2, 132, 199, 0.8);
        animation: issPulse 2s infinite ease-out;
        pointer-events: none;
    }
    @keyframes issPulse {
        0% { transform: scale(0.6); opacity: 1; }
        100% { transform: scale(1.6); opacity: 0; }
    }

    /* Polished Weather Popup Styling */
    .leaflet-popup-content-wrapper {
        background-color: #E2E8F0 !important;
        color: #0F172A !important;
        border: 1px solid #94A3B8;
        border-radius: 8px !important;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15) !important;
    }
    .leaflet-popup-tip {
        background-color: #E2E8F0 !important;
    }
    .popup-button {
        margin-top: 8px;
        padding: 6px 12px;
        font-size: 0.85rem;
        font-weight: 700;
        cursor: pointer;
        background-color: #0284C7;
        color: white;
        border-radius: 6px;
        border: none;
        width: 100%;
        transition: background-color 0.2s ease;
    }
    .popup-button:hover {
        background-color: #0369A1;
    }
</style>

<div id="map"></div>

<script>
    // Define world bounds to prevent endless horizontal scrolling
    const worldBounds = L.latLngBounds(
        L.latLng(-85, -180),
        L.latLng(85, 180)
    );

    // Initialize Map
    const map = L.map('map', {
        minZoom: 2,
        maxBounds: worldBounds,
        maxBoundsViscosity: 1.0
    }).setView([39.8283, -98.5795], 4);

    // Base Street Map Layer
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 19,
        noWrap: true,
        bounds: worldBounds
    }).addTo(map);

    // --- ANIMATED RADAR OVERLAY ---
    let radarLayers = [];
    let currentFrameIndex = 0;

    fetch("https://api.rainviewer.com/public/weather-maps.json")
        .then(response => response.json())
        .then(data => {
            const host = data.host;
            const frames = data.radar.past.slice(-5);

            frames.forEach(frame => {
                const layer = L.tileLayer(`${host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                    attribution: '&copy; RainViewer',
                    opacity: 0,
                    noWrap: true,
                    bounds: worldBounds,
                    maxNativeZoom: 7,
                    maxZoom: 19
                });
                layer.addTo(map);
                radarLayers.push(layer);
            });

            if (radarLayers.length > 0) {
                radarLayers[0].setOpacity(0.55);
                
                setInterval(() => {
                    if (radarLayers.length === 0) return;
                    radarLayers[currentFrameIndex].setOpacity(0);
                    currentFrameIndex = (currentFrameIndex + 1) % radarLayers.length;
                    radarLayers[currentFrameIndex].setOpacity(0.55);
                }, 750);
            }
        })
        .catch(err => console.log("Radar fetch error:", err));

    // --- ISS MARKER LOGIC ---
    let issMarker = null;

    // Custom DivIcon featuring the SVG ISS and a smooth glowing pulse ring underneath
    const issIcon = L.divIcon({
        className: 'iss-marker-container',
        html: `
            <div class="iss-pulsing-glow"></div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/International_Space_Station.svg" style="width: 50px; height: 32px; position: relative; z-index: 2;" />
        `,
        iconSize: [50, 32],
        iconAnchor: [25, 16]
    });

    function updateISSPosition() {
        fetch("/iss_position")
            .then(response => response.json())
            .then(data => {
                // Ignore bad data or null island coords to prevent random jumping
                if (data.latitude !== undefined && data.longitude !== undefined) {
                    if (data.latitude === 0 && data.longitude === 0) return;
                    
                    const newLatLng = [data.latitude, data.longitude];
                    
                    if (!issMarker) {
                        issMarker = L.marker(newLatLng, { icon: issIcon }).addTo(map);
                    } else {
                        issMarker.setLatLng(newLatLng);
                    }
                }
            })
            .catch(err => console.log("ISS fetch error:", err));
    }

    updateISSPosition();
    setInterval(updateISSPosition, 5000);

    // Weather on click logic
    map.on('click', function(e) {
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;

        fetch(`/weather_info?lat=${lat}&lon=${lon}`)
            .then(resp => resp.json())
            .then(data => {
                const tempC = data.temperature_celsius ?? "N/A";
                const tempF = data.temperature_fahrenheit ?? "N/A";
                const cloud = data.cloud_percent ?? "N/A";
                const visibility = data.visibility ?? "N/A";
                const safeLat = lat.toFixed(5).replace('.', '_').replace('-', 'm');
                const safeLon = lon.toFixed(5).replace('.', '_').replace('-', 'm');
                const btnId = `show-sky-btn-${safeLat}-${safeLon}`;

                const popupContent = `
                    <div style="font-family: sans-serif; line-height: 1.6;">
                        <b style="color: #0284C7; font-size: 0.95rem;">Location Data</b><br>
                        <b>Coords:</b> ${lat.toFixed(4)}, ${lon.toFixed(4)}<br>
                        <b>Temp:</b> ${tempC}°C / ${tempF}°F<br>
                        <b>Cloud Cover:</b> ${cloud}%<br>
                        <b>Visibility:</b> ${visibility}<br>
                        <button id="${btnId}" class="popup-button">Show Night Sky</button>
                    </div>
                `;

                L.popup().setLatLng([lat, lon]).setContent(popupContent).openOn(map);

                setTimeout(() => {
                    const btn = document.getElementById(btnId);
                    if (!btn) return;
                    btn.addEventListener("click", async () => {
                        const originalText = btn.textContent;
                        btn.disabled = true;
                        btn.textContent = "Loading…";
                        try {
                            const r = await fetch(`/star_chart?lat=${lat}&lon=${lon}`);
                            const j = await r.json();
                            if (j.error) alert("Error: " + j.error);
                            else if (j.imageUrl) window.open(j.imageUrl, "_blank");
                        } catch (err) { alert("Failed to fetch star chart."); }
                        finally { btn.disabled = false; btn.textContent = originalText; }
                    });
                }, 10);
            });
    });
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<style>
    /* We adjust height to ensure it fits nicely between the nav and footer */
    #map { height: calc(100vh - 140px); width: 100%; }
    .popup-button {
        margin-top: 6px;
        padding: 6px 10px;
        font-size: 0.9rem;
        cursor: pointer;
        background-color: #2563eb;
        color: white;
        border-radius: 4px;
    }
</style>

<div id="map"></div>

<script>
    // Since we added Leaflet to base.html, we just write the logic here
    var map = L.map('map').setView([51.507351, -0.127758], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // ISS marker
    var issMarker = L.marker([0, 0], {icon: L.icon({
        iconUrl: 'https://upload.wikimedia.org/wikipedia/commons/d/d0/International_Space_Station.svg',
        iconSize: [50, 32],
        iconAnchor: [25, 16]
    })}).addTo(map);

    // Update ISS position
    function updateISSPosition() {
        fetch("/iss_position")
            .then(response => response.json())
            .then(data => {
                issMarker.setLatLng([data.latitude, data.longitude]);
            })
            .catch(err => console.log("ISS fetch error:", err));
    }
    setInterval(updateISSPosition, 5000);
    updateISSPosition();

    // Weather on click logic
    map.on('click', function(e) {
        const lat = e.latlng.lat;
        const lon = e.latlng.lng;

        fetch(`/weather_info?lat=${lat}&lon=${lon}`)
            .then(resp => resp.json())
            .then(data => {
                const tempC = data.temperature_celsius ?? "N/A";
                const tempF = data.temperature_fahrenheit ?? "N/A";
                const cloud = data.cloud_percent ?? "N/A";
                const visibility = data.visibility ?? "N/A";
                const safeLat = lat.toFixed(5).replace('.', '_').replace('-', 'm');
                const safeLon = lon.toFixed(5).replace('.', '_').replace('-', 'm');
                const btnId = `show-sky-btn-${safeLat}-${safeLon}`;

                const popupContent = `
                    <div>
                        <b>Location:</b> ${lat.toFixed(4)}, ${lon.toFixed(4)}<br>
                        <b>Temperature:</b> ${tempC}°C / ${tempF}°F<br>
                        <b>Cloud Coverage:</b> ${cloud}%<br>
                        <b>Visibility:</b> ${visibility}<br>
                        <button id="${btnId}" class="popup-button">Show Night Sky</button>
                    </div>
                `;

                L.popup().setLatLng([lat, lon]).setContent(popupContent).openOn(map);

                setTimeout(() => {
                    const btn = document.getElementById(btnId);
                    if (!btn) return;
                    btn.addEventListener("click", async () => {
                        const originalText = btn.textContent;
                        btn.disabled = true;
                        btn.textContent = "Loading…";
                        try {
                            const r = await fetch(`/star_chart?lat=${lat}&lon=${lon}`);
                            const j = await r.json();
                            if (j.error) alert("Error: " + j.error);
                            else if (j.imageUrl) window.open(j.imageUrl, "_blank");
                        } catch (err) { alert("Failed to fetch star chart."); }
                        finally { btn.disabled = false; btn.textContent = originalText; }
                    });
                }, 10);
            });
    });
</script>
{% endblock %}
